<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Celestial and Horizon Systems Comparison</title>
  <meta name="description" content="College-level astronomy materials">
  <meta name="keywords" content="Astronomy education, undergraduate astronomy">
  <!-- KL-UNL shared foundation -->
  <link href="../foundation/css/kl-unl.css" type="text/css" rel="stylesheet" media="all">
  <!-- Simulation-specific style -->
  <link rel="stylesheet" href="simulation.css" type="text/css" media="all">
  <link rel="icon" type="image/png" href="../foundation/images/klunl_favicon_32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="../foundation/images/klunl_favicon_180.png" sizes="180x180">

  <script defer src="../foundation/js/kl-unl-masthead.js"></script>
  <script defer src="../foundation/js/kl-unl-mathjax.js"></script>
  <!-- <script type="module" src="simulation.js"></script> -->
  <script type="module" src="simulation.js"></script>
</head>

<body>

  <a href="#helpBtn-mh" class="sr-only sr-only-focusable">Skip to Help</a>

  <div class="app-shell">

    <kl-unl-masthead sim-id="celestialhorizon" json-url="../foundation/js/kl-unl-masthead.json"></kl-unl-masthead>

    <main class="app-layout sim-layout">

      <!-- ================= diagram panel ================= -->
      <section class="panel sim-panel sim-panel--diagram" aria-labelledby="diagramHeading">
        <h2 class="panel__heading" id="diagramHeading" aria-hidden="true">Sky Diagram</h2>

        <div class="panel__canvas-wrap sim-stage-wrap">
          <canvas id="stage"
                  class="sim-stage"
                  width="380" height="380"
                  role="application"
                  tabindex="0"
                  aria-label="Celestial sphere diagram. Drag, or use the arrow
          keys, to rotate the view. MacOS Voiceover users must first type
          control + option + space to transfer DOM focus to the canvas
          element, then press the left and right arrow keys together to
          disable single-key navigation, and then type control + option +
          shift + tab to set a pass-through lock. Alternatively, they may use
          the A and D keys to rotate the view left and right, and the W and S
          keys to rotate the viewing angle up and down."
                  aria-describedby="stageDesc"></canvas>
        </div>

        <p id="stageDesc" class="sr-only"></p>

      </section>

      <!-- ================= controls panel ================= -->
      <section class="panel sim-panel sim-panel--controls" aria-labelledby="controlsHeading">
        <h2 class="panel__heading" id="controlsHeading" aria-hidden="true">Controls</h2>

        <fieldset class="control-fieldset">
          <legend class="control-fieldset__legend" aria-hidden="true">Change view</legend>

          <div class="sim-switch-row">

            <span class="sim-switch-side sim-switch-side--left">
              <span class="sim-mode-label" id="labelCelestial">celestial sphere<span class="sr-only" id="labelCelestialState"></span></span>
              <span class="sim-arrow sim-arrow--left" aria-hidden="true">
                <svg class="sim-arrow__head" viewBox="0 0 16.75 8.85" focusable="false">
                  <g transform="translate(5.85,4.45)">
                    <path id="headLeft"
                          d="M-1.9 -0.05 Q-1.9 -2.5 -5.75 -4.45 L10.9 -0.05 -5.85 4.4 Q-1.9 2.35 -1.9 -0.05"/>
                  </g>
                </svg>
                <span class="sim-arrow__bar" id="barLeft"></span>
              </span>
            </span>

            <button type="button" class="button sim-switch" id="switchBtn">switch</button>

            <span class="sim-switch-side sim-switch-side--right">
              <span class="sim-arrow sim-arrow--right" aria-hidden="true">
                <span class="sim-arrow__bar" id="barRight"></span>
                <svg class="sim-arrow__head" viewBox="0 0 16.75 8.85" focusable="false">
                  <g transform="translate(5.85,4.45)">
                    <path id="headRight"
                          d="M-1.9 -0.05 Q-1.9 -2.5 -5.75 -4.45 L10.9 -0.05 -5.85 4.4 Q-1.9 2.35 -1.9 -0.05"/>
                  </g>
                </svg>
              </span>
              <span class="sim-mode-label" id="labelHorizon">horizon diagram<span class="sr-only" id="labelHorizonState"></span></span>
            </span>

          </div>
          <div class="control-choice">
            <input type="checkbox" id="chkRdcMotion">
            <label for="chkRdcMotion">Skip transitions</label>
          </div>
        </fieldset>

        <fieldset class="control-fieldset">
          <legend class="control-fieldset__legend" aria-hidden="true">Observer's latitude</legend>

          <div class="control-row sim-control-row">
            <label class="control-row__label" for="latNumber">latitude:</label>
            <input class="control-row__input sim-number" id="latNumber"
                   type="number" min="-90" max="90" step="0.1" value="41.0"
                   inputmode="decimal" autocomplete="off">
            <input class="control-row__slider sim-slider" id="latSlider"
                   type="range" min="-90" max="90" step="0.1" value="41"
                   aria-hidden="true" tabindex="-1">
          </div>

          <!--
          <div class="sim-eqn-row">
            <div id="latEqn" class="sim-eqn" tabindex="-1" aria-hidden="true"></div>
            <p id="latEqnMsg" class="sr-only"></p>
          </div>
          -->  
        </fieldset>
      </section>

    </main>

    <p id="sr-status" class="sr-only" role="status" aria-live="polite"></p>

  </div>

</body>
</html>
