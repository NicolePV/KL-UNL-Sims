<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ecliptic (Zodiac) Simulator</title>
  <meta name="description" content="College-level astronomy materials">
  <meta name="keywords" content="Astronomy education, undergraduate astronomy">
  <!-- KL-UNL shared foundation -->
  <link href="../foundation/css/kl-unl.css" type="text/css" rel="stylesheet" media="all">
  <!-- Simulation-specific style -->
  <link rel="stylesheet" href="simulation.css" type="text/css" media="all">
  <link rel="icon" type="image/png" href="../foundation/images/klunl_favicon_32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="../foundation/images/klunl_favicon_180.png" sizes="180x180">

  <script defer src="../foundation/js/kl-unl-masthead.js"></script>
  <script defer src="../foundation/js/kl-unl-mathjax.js"></script>
  <script type="module" src="simulation.js"></script>
</head>
<body>
  <a href="#helpBtn-mh" class="sr-only sr-only-focusable">Skip to Help</a>

  <div class="app-shell">

    <!-- Title bar + Reset / Help / About from shared masthead -->
    <kl-unl-masthead sim-id="zodiac" json-url="../foundation/js/kl-unl-masthead.json"></kl-unl-masthead>

    <main class="sim-main">

      <!-- Diagram + timeline: wide band of zodiac constellations with year timeline beneath -->
      <section class="panel sim-panel sim-diagram-panel" aria-labelledby="diagram-heading">
        <h2 id="diagram-heading" class="panel__heading">Zodiac View</h2>

        <div class="panel__canvas-wrap sim-canvas-wrap">
          <!-- Band is drag-rotatable: click or tab, then arrow keys. -->
          <div class="sim-stage" id="stage" tabindex="0" role="application"
               aria-label="Wide band of zodiac constellations. Drag with the pointer, or use the left and right arrow keys to swing the view around and the up and down arrow keys to change the viewing elevation."
               aria-describedby="stage-desc"
               aria-keyshortcuts="ArrowLeft ArrowRight ArrowUp ArrowDown">
            <canvas id="stage-canvas" class="sim-canvas" aria-hidden="true"></canvas>
          </div>
        </div>

        <div class="sim-control-body">
          <div class="sim-timeline" id="timeline">
            <label class="sim-timeline__label" for="day-range">Day of Year</label>
            <div class="sim-timeline__track">
              <span class="sim-timeline__marker" aria-hidden="true"></span>
              <div class="sim-timeline__months" id="timeline-months" aria-hidden="true"></div>
              <input class="sim-timeline__input" type="range" id="day-range"
                     min="0" max="365" step="0.01" value="0"
                     aria-valuetext="Day 0 of the year, January 1">
            </div>
          </div>
        </div>

        <p id="stage-desc" class="sr-only"></p>
        <p id="sr-status" class="sr-only" aria-live="polite"></p>
      </section>

    </main>
  </div>

</body>
</html>
