<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Small-Angle Approximation Demonstrator</title>

  <!-- KL-UNL shared foundation (copied in unchanged) -->
  <link href="foundation/kl-unl.css" type="text/css" rel="stylesheet" media="all">
  <!-- Sim-specific styles only -->
  <link href="styles/styles.css" type="text/css" rel="stylesheet" media="all">
</head>
<body>
  <a class="sr-only sr-only-focusable" href="#distance-heading">Skip to controls</a>

  <div class="app-shell">

    <!-- Title bar + Reset / About come from the shared masthead component.
         (This sim has no Help text, so contents.json suppresses the Help button.) -->
    <kl-unl-masthead sim-id="smallAngleDemo" json-url="foundation/contents.json"></kl-unl-masthead>

    <main class="sim-main">

      <!-- ===== Diagram: full width on top =====
           This wide, short diagram needs the room, which keeps the ball legible
           (a side-by-side column shrinks it). The canvas scales fluidly with its
           width, so this row needs no breakpoint of its own. -->
      <section class="panel sim-panel sim-diagram-panel" aria-labelledby="diagram-heading">
        <h2 id="diagram-heading" class="panel__heading">Diagram</h2>

        <!-- Live small-angle equation, typeset by MathJax via klunlShowEquation. -->
        <div class="sim-equation">
          <div id="angle-eqn" class="sim-equation__math" aria-hidden="true"></div>
          <p id="angle-eqn-sr" class="sr-only"></p>
        </div>

        <div class="panel__canvas-wrap sim-canvas-wrap">
          <!-- position:relative wrapper so the alpha label can be overlaid as
               real (MathJax) HTML rather than baked onto the canvas. -->
          <div class="sim-canvas-stage">
            <canvas id="stage-canvas" role="img"
                    aria-label="Small-angle diagram"
                    aria-describedby="stage-desc"></canvas>
            <!-- The Greek alpha that marks the angle at the vertex. Real HTML so
                 it zooms and exposes the MathJax context menu. Positioned in JS. -->
            <span id="alpha-label" class="sim-alpha-label" aria-hidden="true">\(\alpha\)</span>
          </div>
        </div>
        <p id="stage-desc" class="sr-only" aria-live="polite"></p>
      </section>

      <!-- ===== Controls: the foundation .app-layout puts Distance | Diameter side
           by side on PC and collapses them to stacked at the foundation's OWN 56rem
           breakpoint. The multi-column responsiveness is the template's -- there is
           no sim-specific breakpoint -- so updating the template updates every sim. -->
      <div class="app-layout sim-controls-row">

        <div class="app-layout__left">
          <!-- ===== Distance panel ===== -->
          <section class="panel sim-panel" aria-labelledby="distance-heading">
            <h2 id="distance-heading" class="panel__heading">Distance</h2>
        <div class="sim-control-body">
          <div class="control-row sim-slider-row">
            <label class="control-row__label" for="distance-range">distance:</label>
            <!-- aria-valuetext carries the full spoken value WITH unit ("40.0 units");
                 the <label> supplies the quantity name. Updated from state in JS. -->
            <input class="sim-slider" type="range" id="distance-range"
                   min="20" max="60" step="0.1" value="40"
                   aria-valuetext="40.0 units">
            <!-- Visual echoes only; the slider's aria-valuetext already speaks the
                 value + unit, so these are hidden from the screen reader. -->
            <output class="sim-value" id="distance-value" for="distance-range" aria-hidden="true">40.0</output>
            <span class="sim-units" id="distance-units" aria-hidden="true">units</span>
          </div>
          <div class="sim-presets" role="group" aria-label="Distance presets">
            <button type="button" class="button sim-preset" data-kind="distance" data-value="20">20</button>
            <button type="button" class="button sim-preset" data-kind="distance" data-value="30">30</button>
            <button type="button" class="button sim-preset" data-kind="distance" data-value="40">40</button>
            <button type="button" class="button sim-preset" data-kind="distance" data-value="50">50</button>
            <button type="button" class="button sim-preset" data-kind="distance" data-value="60">60</button>
          </div>
        </div>
          </section>
        </div><!-- /app-layout__left -->

        <div class="app-layout__right">
          <!-- ===== Diameter panel ===== -->
          <section class="panel sim-panel" aria-labelledby="diameter-heading">
            <h2 id="diameter-heading" class="panel__heading">Diameter</h2>
        <div class="sim-control-body">
          <div class="control-row sim-slider-row">
            <label class="control-row__label" for="diameter-range">diameter:</label>
            <!-- aria-valuetext carries the full spoken value WITH unit ("2.0 units");
                 the <label> supplies the quantity name. Updated from state in JS. -->
            <input class="sim-slider" type="range" id="diameter-range"
                   min="1" max="3" step="0.1" value="2"
                   aria-valuetext="2.0 units">
            <!-- Visual echoes only; hidden from the screen reader (see above). -->
            <output class="sim-value" id="diameter-value" for="diameter-range" aria-hidden="true">2.0</output>
            <span class="sim-units" id="diameter-units" aria-hidden="true">units</span>
          </div>
          <div class="sim-presets" role="group" aria-label="Diameter presets">
            <button type="button" class="button sim-preset" data-kind="diameter" data-value="1">1</button>
            <button type="button" class="button sim-preset" data-kind="diameter" data-value="2">2</button>
            <button type="button" class="button sim-preset" data-kind="diameter" data-value="3">3</button>
          </div>
        </div>
          </section>
        </div><!-- /app-layout__right -->

      </div><!-- /app-layout (controls) -->

    </main>
  </div>

  <!-- Foundation equation helper (copied in unchanged) -->
  <script src="foundation/kl-unl.js"></script>
  <!-- Shared masthead custom element (copied in unchanged) -->
  <script src="foundation/kl-unl-masthead.js"></script>

  <!-- MathJax (vendored locally; SVG output is self-contained, no CDN). -->
  <script>
    window.MathJax = {
      loader: { failed: function (err) { console.warn('[MathJax] optional component not vendored:', err.message); } },
      tex: { inlineMath: [['\\(', '\\)'], ['$', '$']] },
      svg: { fontCache: 'local' },
      options: { enableMenu: true, menuOptions: { settings: { assistiveMml: false } } }
    };
  </script>
  <script src="assets/mathjax/tex-mml-svg.js"></script>

  <!-- Sim logic -->
  <script src="simulation.js"></script>
</body>
</html>
