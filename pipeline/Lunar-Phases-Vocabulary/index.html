<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lunar Phase Vocabulary</title>

  <link rel="icon" type="image/png" sizes="32x32" href="foundation/klunl_favicon_32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="foundation/klunl_favicon_180.png">

  <!-- KL-UNL shared foundation (copied in unchanged) -->
  <link href="foundation/kl-unl.css" type="text/css" rel="stylesheet" media="all">
  <!-- Sim-specific styles only -->
  <link href="styles/styles.css" type="text/css" rel="stylesheet" media="all">
</head>
<body>
  <a class="sr-only sr-only-focusable" href="#phase-heading">Skip to phase controls</a>

  <div class="app-shell">

    <!-- Title bar + Reset / Help / About come from the shared masthead component.
         Its text is read from foundation/contents.json under sim-id "lunar_phaser". -->
    <kl-unl-masthead sim-id="lunar_phaser" json-url="foundation/contents.json"></kl-unl-masthead>

    <main class="app-layout sim-layout">

      <!-- ===== Moon (the diagram) =====
           The original Flash stage is portrait: moon on top, the phase-name grid
           below it, the animation row last. The foundation's .app-layout puts the
           diagram beside the controls on desktop and collapses to exactly that
           stacked portrait order at its own 56rem breakpoint. -->
      <div class="app-layout__left">
        <section class="panel sim-panel" aria-labelledby="moon-heading">
          <h2 id="moon-heading" class="panel__heading">Moon</h2>
          <div class="panel__canvas-wrap sim-canvas-wrap">
            <!-- Backing store is the original symbol's own 220x220 coordinate box
                 (see simulation.js); CSS scales it. role="img" + aria-describedby
                 carry the picture to screen readers. Not a tab stop: nothing here
                 is operable. -->
            <canvas id="moon-canvas" role="img"
                    aria-label="The moon at its current phase"
                    aria-describedby="moon-desc"></canvas>
          </div>
          <p id="moon-desc" class="sr-only"></p>
        </section>
      </div>

      <div class="app-layout__right">

        <!-- ===== Phase names =====
             Same 2-column arrangement, same pairing, same order as the original
             stage: waxing names down the left, the matching waning names down the
             right. DOM order is row-wise so the tab order matches what is seen. -->
        <section class="panel sim-panel" aria-labelledby="phase-heading">
          <h2 id="phase-heading" class="panel__heading">Phase Names</h2>
          <fieldset class="control-fieldset sim-phase-fieldset">
            <legend class="control-fieldset__legend sr-only">Choose a lunar phase</legend>
            <div class="control-grid sim-phase-grid">
              <button type="button" class="button sim-phase" data-phase="new moon">New Moon</button>
              <button type="button" class="button sim-phase" data-phase="full moon">Full Moon</button>
              <button type="button" class="button sim-phase" data-phase="waxing crescent">Waxing Crescent</button>
              <button type="button" class="button sim-phase" data-phase="waning gibbous">Waning Gibbous</button>
              <button type="button" class="button sim-phase" data-phase="first quarter">First Quarter</button>
              <button type="button" class="button sim-phase" data-phase="last quarter">Last Quarter</button>
              <button type="button" class="button sim-phase" data-phase="waxing gibbous">Waxing Gibbous</button>
              <button type="button" class="button sim-phase" data-phase="waning crescent">Waning Crescent</button>
            </div>
          </fieldset>
        </section>

        <!-- ===== Animation =====
             The original swapped a "Run Animation" button for a "Stop Animation"
             button at the same spot; here one button changes its label, so keyboard
             focus survives the press. Labels are the original strings verbatim. -->
        <section class="panel sim-panel" aria-labelledby="anim-heading">
          <h2 id="anim-heading" class="panel__heading">Animation</h2>
          <div class="sim-anim-row">
            <button type="button" class="button sim-anim-button" id="anim-button">Run Animation</button>
            <!-- Elapsed time. Typeset by MathJax through klunlShowEquation so the
                 value exposes the MathJax context menu and zooms as real text;
                 the paired .sr-only string speaks it with its unit. -->
            <div class="sim-readout">
              <div id="elapsed-eqn" class="sim-readout__math" aria-hidden="true"></div>
              <p id="elapsed-sr" class="sr-only"></p>
            </div>
          </div>
        </section>

      </div><!-- /app-layout__right -->
    </main>

    <!-- Announces committed changes only (button presses, phase-name crossings),
         never every animation frame. -->
    <p id="sim-status" class="sr-only" role="status" aria-live="polite"></p>

  </div>

  <!-- Foundation equation helper (copied in unchanged) -->
  <script src="foundation/kl-unl.js"></script>
  <!-- Shared masthead custom element (copied in unchanged) -->
  <script src="foundation/kl-unl-masthead.js"></script>

  <!-- MathJax (vendored locally; SVG output is self-contained, no CDN). -->
  <script>
    window.MathJax = {
      loader: { failed: function (err) { console.warn('[MathJax] optional component not vendored:', err.message); } },
      tex: { inlineMath: [['\\(', '\\)'], ['$', '$']] },
      svg: { fontCache: 'local' },
      options: { enableMenu: true, menuOptions: { settings: { assistiveMml: false } } }
    };
  </script>
  <script src="assets/mathjax/tex-mml-svg.js"></script>

  <!-- Sim logic -->
  <script src="simulation.js"></script>
</body>
</html>
