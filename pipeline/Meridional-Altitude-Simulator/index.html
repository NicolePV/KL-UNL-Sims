<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meridional Altitude Simulator</title>

  <link rel="icon" type="image/png" sizes="32x32" href="foundation/klunl_favicon_32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="foundation/klunl_favicon_180.png">

  <!-- KL-UNL shared foundation (copied in unchanged) -->
  <link href="foundation/kl-unl.css" type="text/css" rel="stylesheet" media="all">
  <!-- Sim-specific styles only -->
  <link href="styles/styles.css" type="text/css" rel="stylesheet" media="all">
</head>
<body>
  <a class="sr-only sr-only-focusable" href="#object-heading">Skip to controls</a>

  <div class="app-shell">

    <!-- Title bar + Reset / Help / About come from the shared masthead component. -->
    <kl-unl-masthead sim-id="meridaltdiagram" json-url="foundation/contents.json"></kl-unl-masthead>

    <main class="sim-main">

      <!-- ===== Diagram panel: the two linked diagrams of the original, full width ===== -->
      <section class="panel sim-panel sim-diagram-panel" aria-labelledby="diagram-heading">
        <h2 id="diagram-heading" class="panel__heading">Diagram</h2>

        <div class="panel__canvas-wrap sim-canvas-wrap">
          <!-- position:relative stage so every symbol/label can live in real HTML
               (typeset by MathJax) instead of being painted onto the canvas. -->
          <div class="sim-stage" id="sim-stage">
            <canvas id="stage-canvas" role="img"
                    aria-label="Cross-section of the Earth on the left and the observer's horizon diagram on the right"
                    aria-describedby="stage-desc"></canvas>

            <!-- Draggable / arrow-key observer position on the cross-section diagram. -->
            <div id="observer-handle" class="sim-handle" role="slider" tabindex="0"
                 aria-label="Observer position on the Earth cross-section, latitude"
                 aria-valuemin="-90" aria-valuemax="90" aria-valuenow="41"
                 aria-valuetext="Latitude 41 degrees north"></div>

            <!-- Diagram symbols. Real HTML so they zoom, meet contrast on their own,
                 and expose the MathJax context menu. Positioned from render(). -->
            <span class="sim-label sim-label--pole"    id="lbl-pole"      aria-hidden="true"></span>
            <span class="sim-label sim-label--equator" id="lbl-equator"   aria-hidden="true"></span>
            <span class="sim-label sim-label--north"   id="lbl-north"     aria-hidden="true"></span>
            <span class="sim-label sim-label--south"   id="lbl-south"     aria-hidden="true"></span>
            <span class="sim-label sim-label--zenith"  id="lbl-zenith"    aria-hidden="true"></span>

            <span class="sim-label sim-label--pole"    id="lbl-pole-2"    aria-hidden="true"></span>
            <span class="sim-label sim-label--zenith"  id="lbl-zenith-2"  aria-hidden="true"></span>
            <span class="sim-label sim-label--north"   id="lbl-north-2"   aria-hidden="true"></span>
            <span class="sim-label sim-label--south"   id="lbl-south-2"   aria-hidden="true"></span>

            <span class="sim-label sim-label--fixed"   id="lbl-np"        aria-hidden="true"></span>
            <span class="sim-label sim-label--fixed"   id="lbl-sp"        aria-hidden="true"></span>
            <span class="sim-label sim-label--fixed"   id="lbl-eq"        aria-hidden="true"></span>
          </div>
        </div>

        <p class="panel__help sim-help">
          Drag the observer marker on the left-hand cross-section, or focus it and use the
          arrow keys, to change the latitude. The right-hand diagram shows that observer's
          horizon.
        </p>

        <!-- Text equivalent of the diagram for screen-reader users. -->
        <p id="stage-desc" class="sr-only"></p>
      </section>

      <!-- ===== Controls row: Object | Coordinates | Meridional Altitude,
           mirroring the three groups along the bottom of the original. ===== -->
      <div class="app-layout sim-controls-row">

        <div class="app-layout__left">
          <section class="panel sim-panel" aria-labelledby="object-heading">
            <h2 id="object-heading" class="panel__heading">Object</h2>
            <fieldset class="control-fieldset">
              <legend class="control-fieldset__legend sr-only">Object</legend>
              <div class="control-grid sim-object-grid">
                <div class="control-choice">
                  <input type="radio" id="obj-none" name="object" value="0" checked>
                  <label for="obj-none">No Object</label>
                </div>
                <div class="control-choice">
                  <input type="radio" id="obj-planet" name="object" value="3">
                  <label for="obj-planet">Planet</label>
                </div>
                <div class="control-choice">
                  <input type="radio" id="obj-star" name="object" value="1">
                  <label for="obj-star">Star</label>
                </div>
                <div class="control-choice">
                  <input type="radio" id="obj-moon" name="object" value="4">
                  <label for="obj-moon">Moon</label>
                </div>
                <div class="control-choice">
                  <input type="radio" id="obj-sun" name="object" value="2">
                  <label for="obj-sun">Sun</label>
                </div>
              </div>
            </fieldset>
          </section>
        </div>

        <div class="app-layout__right">
          <div class="sim-controls-pair">

            <!-- ===== Latitude / Declination sliders ===== -->
            <section class="panel sim-panel" aria-labelledby="coords-heading">
              <h2 id="coords-heading" class="panel__heading">Coordinates</h2>
              <fieldset class="control-fieldset">
                <legend class="control-fieldset__legend sr-only">Coordinates</legend>

                <div class="control-row sim-slider-row">
                  <label class="control-row__label" for="lat-range">Latitude</label>
                  <span class="sim-slider-value" id="lat-value" aria-hidden="true"></span>
                  <input class="control-row__slider sim-slider" type="range" id="lat-range"
                         min="-90" max="90" step="0.1" value="41"
                         aria-valuetext="Latitude 41 degrees north">
                  <span class="sim-slider-end sim-slider-end--min" id="lat-min" aria-hidden="true"></span>
                  <span class="sim-slider-end sim-slider-end--max" id="lat-max" aria-hidden="true"></span>
                </div>

                <div class="control-row sim-slider-row" id="dec-row">
                  <label class="control-row__label" for="dec-range">Declination</label>
                  <span class="sim-slider-value" id="dec-value" aria-hidden="true"></span>
                  <input class="control-row__slider sim-slider" type="range" id="dec-range"
                         min="-90" max="90" step="0.1" value="23.5"
                         aria-valuetext="Declination 23.5 degrees">
                  <span class="sim-slider-end sim-slider-end--min" id="dec-min" aria-hidden="true"></span>
                  <span class="sim-slider-end sim-slider-end--max" id="dec-max" aria-hidden="true"></span>
                </div>

              </fieldset>
            </section>

            <!-- ===== Meridional altitude readout + range overlays ===== -->
            <section class="panel sim-panel sim-altitude-panel" aria-labelledby="altitude-heading">
              <h2 id="altitude-heading" class="panel__heading">Meridional Altitude</h2>

              <div class="sim-equation">
                <div id="altitude-eqn" class="sim-equation__math" aria-hidden="true"></div>
                <p id="altitude-eqn-sr" class="sr-only"></p>
              </div>

              <fieldset class="control-fieldset">
                <legend class="control-fieldset__legend">Ranges</legend>
                <div class="control-choice">
                  <input type="checkbox" id="sun-range">
                  <label for="sun-range">Show Sun/Planet Range</label>
                </div>
                <div class="control-choice">
                  <input type="checkbox" id="moon-range">
                  <label for="moon-range">Show Moon Range</label>
                </div>
              </fieldset>
            </section>

          </div>
        </div>

      </div><!-- /app-layout -->

    </main>
  </div>

  <!-- Single polite status region: every committed change is announced here. -->
  <p id="live-region" class="sr-only" aria-live="polite"></p>

  <!-- Foundation equation helper (copied in unchanged) -->
  <script src="foundation/kl-unl.js"></script>
  <!-- Shared masthead custom element (copied in unchanged) -->
  <script src="foundation/kl-unl-masthead.js"></script>

  <!-- MathJax (vendored locally; SVG output is self-contained, no CDN). -->
  <script>
    window.MathJax = {
      loader: { failed: function (err) { console.warn('[MathJax] optional component not vendored:', err.message); } },
      tex: { inlineMath: [['\\(', '\\)'], ['$', '$']] },
      svg: { fontCache: 'local' },
      options: { enableMenu: true, menuOptions: { settings: { assistiveMml: false } } }
    };
  </script>
  <script src="assets/mathjax/tex-mml-svg.js"></script>

  <!-- Sim logic -->
  <script src="simulation.js"></script>
</body>
</html>
